<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F7A3D"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Gura"><meta name="application-name" content="Gura"><link rel="stylesheet" href="style.css"><script src="data.js"></script><script src="app.js"></script><title>Categories · Gura.rw (demo)</title></head><body>
<div class="wrap">
  <div class="page-head"><h1 data-i18n="all_cats">All categories</h1></div>
  <div class="grid g3" id="list" style="margin-top:12px"></div>
  <p class="ex-note">*Counts are example ads in this demo.</p>
</div>
<script>
window.onLang = () => {
  list.innerHTML = GURA.mcats.map(c=>`<div class="card" style="padding:0;overflow:hidden">
    <a class="cat-row" href="${catHref(c)}"><div class="ico" style="background:${c.bg}">${c.icon}</div><div><b>${c[lang()]}</b><div class="muted small">${catCount(c.id)} ${c.id==="jobs"?t("jobs_found"):t("ads_word")}</div></div><span class="go">›</span></a>
    ${c.subs.length?`<div class="chips subchips" style="padding:0 14px 12px;margin:0">${c.subs.map(s=>`<a class="chip" href="${c.id==="services"&&s[0]==="pros"?"services.html":`category.html?c=${c.id}&sub=${s[0]}`}">${lang()==="rw"?s[2]:s[1]}</a>`).join("")}</div>`:""}</div>`).join("");
};
</script></body></html>
