<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F7A3D"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fundi.rw"><meta name="application-name" content="Fundi.rw"><link rel="stylesheet" href="style.css"><script src="data.js"></script><script src="app.js"></script><title>Jobs & gigs · Fundi.rw (demo)</title></head><body>
<div class="wrap">
  <div class="page-head"><h1 data-i18n="jobs_t">Jobs &amp; gigs</h1><p class="muted small" data-i18n="jobs_s"></p></div>
  <div class="chips" id="chips" style="margin-top:12px"></div>
  <div class="filters card" style="margin-bottom:14px">
    <div><label data-i18n="where">Sector</label><select id="jsec"></select></div>
    <div><label data-i18n="job_type">Type</label><select id="jtype"></select></div>
  </div>
  <p class="muted small"><b id="count"></b> <span data-i18n="jobs_found">jobs</span></p>
  <div class="grid g2m" id="list"></div>
  <p class="ex-note">*Every job ad here is a fake example. Apply buttons open WhatsApp to a placeholder number.</p>
</div>
<script>
let jcat = qs("cat") || "";
function render(){
  const cats = [...new Set(FUNDI.jobs.map(j=>j.cat))];
  chips.innerHTML = [""].concat(cats).map(c=>`<button class="chip ${c===jcat?"on":""}" onclick="jcat='${c}';render()">${c?catIcon(c)+" "+catName(c):"✨ "+t("all")}</button>`).join("");
  const L = FUNDI.jobs.filter(j=>(!jcat||j.cat===jcat)&&(!jsec.value||j.sector===jsec.value)&&(!jtype.value||j.type===jtype.value));
  count.textContent = L.length;
  list.innerHTML = L.length ? L.map(jobCard).join("") : '<div class="card empty">😕 No jobs match. Try another filter.</div>';
}
window.init = () => { ["jsec","jtype"].forEach(id=>document.getElementById(id).addEventListener("input",render)); };
window.onLang = () => {
  const sv = jsec.value, tv = jtype.value;
  jsec.innerHTML = `<option value="">${t("any")}</option>` + [...new Set(FUNDI.jobs.map(j=>j.sector))].sort().map(s=>`<option>${s}</option>`).join("");
  jtype.innerHTML = `<option value="">${t("all_types")}</option>` + [...new Set(FUNDI.jobs.map(j=>j.type))].map(s=>`<option>${s}</option>`).join("");
  jsec.value = sv; jtype.value = tv; render();
};
</script></body></html>
