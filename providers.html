<script>
let sort = "rating";
const SORTS = { rating:(a,b)=>b.rating-a.rating||b.reviews-a.reviews, price:(a,b)=>a.from-b.from, reviews:(a,b)=>b.reviews-a.reviews };
function render(){
  sortbar.innerHTML = Object.keys(SORTS).map(k=>`<button class="chip ${k===sort?"on":""}" onclick="sort='${k}';render()">${t("sort_"+k)}</button>`).join("");
  list.innerHTML = [...KUZAYO.providers].sort(SORTS[sort]).map(providerCard).join("");
}
window.onLang = render;
</script></body></html>
