<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F7A3D"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fundi.rw"><meta name="application-name" content="Fundi.rw"><link rel="stylesheet" href="style.css"><script src="data.js"></script><script src="app.js"></script><title>Top pros · Fundi.rw (demo)</title></head><body>
<div class="wrap">
  <div class="page-head"><h1 data-i18n="pros_t">Top pros</h1><p class="muted small" data-i18n="pros_s"></p></div>
  <div class="sortbar" id="sortbar"></div>
  <div class="grid g2m" id="list"></div>
  <div class="card" style="margin-top:18px;background:linear-gradient(120deg,var(--yl),#fff);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
    <div><h3 style="margin:0" data-i18n="join_t">Grow your business with Fundi</h3><p class="muted small" data-i18n="join_s" style="margin:0"></p></div><a class="btn sm" href="join.html" data-i18n="nav_join">Join as a pro</a></div>
</div>
<script>
let sort = "rating";
const SORTS = { rating:(a,b)=>b.rating-a.rating||b.reviews-a.reviews, price:(a,b)=>a.from-b.from, reviews:(a,b)=>b.reviews-a.reviews };
function render(){
  sortbar.innerHTML = Object.keys(SORTS).map(k=>`<button class="chip ${k===sort?"on":""}" onclick="sort='${k}';render()">${t("sort_"+k)}</button>`).join("");
  list.innerHTML = [...FUNDI.providers].sort(SORTS[sort]).map(providerCard).join("");
}
window.onLang = render;
</script></body></html>
