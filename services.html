<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F7A3D"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Gura"><meta name="application-name" content="Gura"><link rel="stylesheet" href="style.css"><script src="data.js"></script><script src="app.js"></script><title>Services · Gura.rw (demo)</title></head><body>
<div class="wrap">
  <div class="page-head"><h1 data-i18n="all_services">All services</h1><p class="muted small" data-i18n="all_services_s"></p></div>
  <div class="grid g3" id="cats" style="margin-top:12px"></div>
</div>
<script>
window.onLang = () => {
  cats.innerHTML = GURA.categories.map(c=>{ const n = GURA.providers.filter(p=>p.category===c.id).length;
    return `<a class="card cat-row${c.soon?" dis":""}" href="${c.soon?'#':'search.html?cat='+c.id}"${c.soon?' onclick="return false"':""}><div class="ico">${c.icon}</div><div><b>${c[lang()]}</b><div class="muted small">${c.soon?`<span class="badge">${t("soon")}</span>`:`${n} ${t("pros_word")}`}</div></div><span class="go">${c.soon?"":"›"}</span></a>`; }).join("");
};
</script></body></html>
